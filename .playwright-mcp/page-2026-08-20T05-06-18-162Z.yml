    - generic [ref=f7e24]:
      - article [ref=f7e25]:
        - heading "快速印象" [level=2] [ref=f7e26]
        - paragraph [ref=f7e27]: 美国跨越多个气候和地貌区。判断时应优先组合道路标线、路牌样式、地形、植被和州级差异，不要依赖单一线索。
        - heading "植被与地貌" [level=2] [ref=f7e28]
        - list [ref=f7e29]:
          - listitem [ref=f7e30]: 西南部常见干旱地貌、灌木和仙人掌。
          - listitem [ref=f7e31]: 太平洋西北部整体更湿润，针叶林密度较高。
          - listitem [ref=f7e32]: 中部大平原地形开阔，农田与长距离直路较常见。
          - listitem [ref=f7e33]: 东南部湿度较高，阔叶植被和路旁绿化更密集。
        - heading "道路观察" [level=2] [ref=f7e34]
        - list [ref=f7e35]:
          - listitem [ref=f7e36]: 车辆靠右行驶。
          - listitem [ref=f7e37]: 道路中心通常使用黄色线分隔相反方向车流。
          - listitem [ref=f7e38]: 白色线通常分隔同向车道或标示道路外缘。
          - listitem [ref=f7e39]: 公路编号、州级道路盾牌和限速牌是重要辅助信息。
        - heading "街景覆盖" [level=2] [ref=f7e40]
        - paragraph [ref=f7e41]: Google 官方街景覆盖广泛，但不同道路的拍摄时间、清晰度和光照可能不同。本站街景预览由 Street View Static API 在线返回，不保存 Google 街景截图。
        - blockquote [ref=f7e42]:
          - paragraph [ref=f7e43]: 当前内容用于验证资料页结构，并不是完整的美国图寻指南。后续笔记会按州和线索类型继续扩写。
